<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}button.ghost{background:#8a7f72}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.tag{color:#a0522d;font-size:12px;border:1px solid #a0522d;border-radius:4px;padding:0 4px;margin-left:6px}.lca{font-weight:700;color:#3a5a3a}.muted{color:#888}.gen{color:#5b3d22}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:5px 8px;text-align:left;vertical-align:top}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>版本谱系：登记承传</h2><p class="muted">每个子本至多一个父本；祖本没有父本。父本必须出自同一作品，祖先链绕回自己会被拒绝。</p><div class="grid"><input id="swork" type="number" placeholder="作品 ID"><input id="suser" type="number" placeholder="用户 ID"><input id="schild" type="number" placeholder="子本版本 ID"><input id="sparent" type="number" placeholder="父本版本 ID（祖本留空后撤回）"><input id="sbasis" placeholder="承传依据（谁据谁抄）"></div><button onclick="setParent()">登记/改选父本</button><button class="ghost" onclick="clearParent()">撤回父本</button><button class="ghost" onclick="loadStemma()">查看谱系与未登记版本</button><pre id="stemma"></pre></section><section><h2>校勘稿谱系</h2><input id="cwork" type="number" placeholder="作品 ID"><input id="cuser" type="number" placeholder="用户 ID"><button class="ghost" onclick="collation()">查看校勘稿（祖先链/世代/共同祖本）</button><pre id="collation"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=typeof x==='string'?x:JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
function setParent(){post('/api/witnesses/'+schild.value+'/parent',{parent_id:+sparent.value,basis:sbasis.value,user_id:+suser.value},'#stemma').then(loadStemma)}
function clearParent(){post('/api/witnesses/'+schild.value+'/parent/clear',{user_id:+suser.value},'#stemma').then(loadStemma)}
async function loadStemma(){const d=await(await fetch('/api/state')).json();const wid=+swork.value;const list=(d.witnesses||[]).filter(w=>!wid||w.work_id===wid);const byId=Object.fromEntries(list.map(w=>[w.id,w]));const unregistered=list.filter(w=>w.parent_id==null);const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const kindName={version:'版本',fragment:'残片',transcription:'转录'};let out='共 '+list.length+' 个版本；已登记父本 '+(list.length-unregistered.length)+' 个；尚未登记来源 '+unregistered.length+' 个：'+unregistered.map(w=>esc(w.siglum)).join('、')+'\n\n';out+=list.map(w=>'#'+w.id+' '+esc(w.siglum)+'（'+kindName[w.kind]+'）'+(w.parent_id==null?' <span class="tag">尚未登记来源</span>':'　← 父本 #'+w.parent_id+' '+(byId[w.parent_id]?esc(byId[w.parent_id].siglum):'')+'；依据：'+esc(w.parent_basis))).join('\n');document.querySelector('#stemma').innerHTML=out}
async function collation(){const d=await(await fetch('/api/works/'+cwork.value+'/collation?user_id='+cuser.value).json());if(d.error){show('#collation',d);return}let out='作品：'+d.work.title+'\n\n';for(const p of d.passages){out+='【'+p.label+'】共同祖本：'+(p.common_ancestor_siglum?'<span class="lca">〔'+p.common_ancestor_siglum+'〕</span>':'（各版本分属不同谱系，无共同祖本）')+'\n';for(const a of p.alignments){out+='  · '+a.siglum+'　<span class="gen">第'+a.generation+'世</span>　祖先链（祖本→子本）：'+a.ancestor_chain.join(' → ')+'\n'}out+='\n'}document.querySelector('#collation').innerHTML=out}
state()</script></html>
