<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.warn{color:#9a3a1f;font-weight:bold}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 8px;text-align:left}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section>
<section><h2>版本谱系</h2>
<p>为同一作品中的版本登记父本与依据；父本留空即定为祖本。改选父本若形成环路会被拒绝。</p>
<div class="grid"><input id="swork" type="number" placeholder="作品 ID"><input id="switness" type="number" placeholder="子本 ID"><input id="sparent" type="number" placeholder="父本 ID（祖本留空）"><input id="suser" type="number" placeholder="用户 ID"><textarea id="sbasis" placeholder="承传依据，如：行款、避讳字同甲本"></textarea></div>
<button onclick="stemma()">查看谱系</button>
<button onclick="setLineage()">建/改父本关系</button>
<button onclick="withdraw()">撤回关系</button>
<div id="stemmaView"></div><pre id="sresult"></pre>
</section>
<section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><button onclick="collation()">导出校勘稿</button><pre id="result"></pre></section>
<section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section>
<script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function state(){show('#state',await(await fetch('/api/state')).json())}
function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}
function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}
function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}
function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}
function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
function collation(){get('/api/works/'+work.value+'/collation?user_id='+(suser.value||user.value),'#result')}
function setLineage(){
  const pv=sparent.value.trim();
  post('/api/witnesses/'+switness.value+'/lineage',{parent_id:pv===''?null:+pv,basis:sbasis.value,user_id:+suser.value},'#sresult').then(stemma);
}
function withdraw(){post('/api/witnesses/'+switness.value+'/lineage/withdraw',{user_id:+suser.value},'#sresult').then(stemma)}
async function stemma(){
  const data=await(await fetch('/api/works/'+swork.value+'/stemma?user_id='+suser.value)).json();
  show('#sresult',data);
  if(!data.witnesses){document.querySelector('#stemmaView').innerHTML='';return}
  let html='<table><tr><th>版本</th><th>父本</th><th>世代</th><th>祖先链（近→远）</th><th>依据</th><th>状态</th></tr>';
  for(const w of data.witnesses){
    const chain=w.ancestor_chain.map(x=>x.siglum).join(' → ');
    const status=w.is_root?'祖本':(w.registered?'已登记':'<span class="warn">尚未登记来源</span>');
    const parent=w.parent_id?w.ancestor_chain.find(x=>x.witness_id===w.parent_id)?.siglum||w.parent_id:'—';
    html+=`<tr><td>${w.siglum}</td><td>${parent}</td><td>${w.generation}</td><td>${chain}</td><td>${w.basis||''}</td><td>${status}</td></tr>`;
  }
  html+='</table>';
  if(data.unregistered.length) html+='<p class="warn">尚未登记来源的版本：'+data.unregistered.map(x=>x.siglum).join('、')+'</p>';
  document.querySelector('#stemmaView').innerHTML=html;
}
state()
</script></html>
